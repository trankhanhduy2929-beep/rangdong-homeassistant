send_command:
  name: Gửi lệnh DP thô
  description: Gửi một lệnh data-point Tuya qua kết nối LAN nội bộ hoặc cloud cũ đã cấu hình.
  fields:
    device_id:
      name: Device ID
      description: Thuộc tính device_id được hiển thị bởi cảm biến tổng quan.
      required: true
      example: example-device-id
      selector:
        text:
    code:
      name: Mã DP
      description: Mã DP của cloud cũ. Với thiết bị local, hãy dùng dp_id dạng số.
      required: false
      example: switch_led
      selector:
        text:
    dp_id:
      name: ID DP local
      description: ID data-point Tuya dạng số trong thuộc tính cảm biến trạng thái LAN.
      required: false
      example: 1
      selector:
        number:
          min: 1
          max: 255
          mode: box
    value:
      name: Giá trị
      description: Giá trị boolean, số, chuỗi, object hoặc danh sách mà DP của thiết bị chấp nhận.
      required: true
      example: true
