name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  hassfest:
    name: Home Assistant validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@f4ca6f671bd429efb108c0f2fa0ae8af0215986c # master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Run HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

  release:
    name: Build and publish ZIP
    needs:
      - hassfest
      - hacs
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify manifest version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          manifest_version="$(jq -r '.version' custom_components/rangdong_smart/manifest.json)"
          tag_version="${RELEASE_TAG#v}"
          test "$manifest_version" = "$tag_version"

      - name: Build integration archive
        run: |
          mkdir -p dist
          manifest_version="$(jq -r '.version' custom_components/rangdong_smart/manifest.json)"
          archive_name="rangdong_smart-v${manifest_version}.zip"
          git archive \
            --format=zip \
            --prefix=custom_components/rangdong_smart/ \
            --output="dist/${archive_name}" \
            "${GITHUB_SHA}:custom_components/rangdong_smart"
          unzip -t "dist/${archive_name}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: dist/rangdong_smart-v*.zip
          fail_on_unmatched_files: true
