name: Validate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  android-helper:
    name: Android helper app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Home Assistant app metadata
        uses: frenck/action-app-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21
        with:
          path: ./rangdong_key_helper

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python validation tools
        run: >-
          python -m pip install
          aiohttp==3.14.3
          frida-tools==14.10.4
          pytest==9.1.1
          pyyaml==6.0.3
          ruff==0.16.4

      - name: Lint and test helper
        env:
          PYTHONPATH: rangdong_key_helper/rootfs/app
        run: |
          ruff check \
            rangdong_key_helper/rootfs/app/rangdong_helper \
            rangdong_key_helper/tests
          ruff format --check \
            rangdong_key_helper/rootfs/app/rangdong_helper \
            rangdong_key_helper/tests
          pytest -q rangdong_key_helper/tests

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rangdong_key_helper/agent/package-lock.json

      - name: Verify compiled Frida agent
        working-directory: rangdong_key_helper/agent
        run: |
          npm ci
          frida-compile \
            src/index.ts \
            -o /tmp/rangdong-frida-agent.js \
            -c -S -T none
          cmp /tmp/rangdong-frida-agent.js \
            ../rootfs/app/rangdong_helper/frida_agent.js

      - name: Build helper container
        run: |
          version="$(python -c 'import yaml; print(yaml.safe_load(open("rangdong_key_helper/config.yaml"))["version"])')"
          docker build \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg BUILD_VERSION="${version}" \
            --tag rangdong-key-helper:test \
            rangdong_key_helper

  hassfest:
    name: Home Assistant validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@f4ca6f671bd429efb108c0f2fa0ae8af0215986c # master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Run HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
